[project]
name = "phase1-math-engine"
version = "0.1.0"
description = "Computational Linear Algebra & Math Engine for ML from Scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "scipy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decompositions", "src/solvers", "src/spectral", "src/applications"]
